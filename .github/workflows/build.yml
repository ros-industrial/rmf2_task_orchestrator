name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: style
        run: cargo fmt --all --check

  build:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 4s
          --health-timeout 2s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Install mosquitto
        run: |
          sudo apt-get update -qq -y
          sudo apt-get install mosquitto --no-install-recommends -qq -y

      - name: Start MQTT broker
        run: |
          mosquitto -d
          timeout 5 bash -c 'until echo > /dev/tcp/127.0.0.1/1883; do sleep 0.5; done'

      # Cache reused across all runs
      - name: clippy
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      # Future-proof: check features + multiple crates
      - name: test
        run: cargo test --workspace --locked --all-targets --all-features

      - name: test (no-default-features)
        run: cargo test --workspace --locked --no-default-features
